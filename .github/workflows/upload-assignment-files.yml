name: Upload assignment files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-files:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify files
        shell: bash
        run: |
          set -euo pipefail

          pdf_name='ΕΡΓΑΣΙΑ Ι ΠΑΠΑΔΗΜΑ ΑΓΓΕΛΙΚΗ 10848201 (1).pdf'
          zip_name='ΕΡΓΑΣΙΑ Ι ΠΑΠΑΔΗΜΑ ΑΓΓΕΛΙΚΗ 1084820 ΚΩΔΙΚΕΣ (1).zip'

          curl -L --fail --retry 3 --retry-delay 2 --output "$pdf_name" 'https://tmpfiles.org/dl/1787580558.52bbea5edce5300f/whw828FA1sQH/u108482011.pdf'
          curl -L --fail --retry 3 --retry-delay 2 --output "$zip_name" 'https://tmpfiles.org/dl/1787580559.e5f96b7c9aed6a47/wMwo2fFq1H9r/u10848201.zip'

          printf '%s  %s\n' 'ff22bbd38d682c252dc2d0f72f2533d421aed7074ea82c9425c3dda47364baad' "$pdf_name" | sha256sum -c -
          printf '%s  %s\n' 'adaaf5d01366a62e994aa8761fc63e49ec4441e74db2a82e3a19808de22fe01a' "$zip_name" | sha256sum -c -

      - name: Commit files
        shell: bash
        run: |
          set -euo pipefail

          pdf_name='ΕΡΓΑΣΙΑ Ι ΠΑΠΑΔΗΜΑ ΑΓΓΕΛΙΚΗ 10848201 (1).pdf'
          zip_name='ΕΡΓΑΣΙΑ Ι ΠΑΠΑΔΗΜΑ ΑΓΓΕΛΙΚΗ 1084820 ΚΩΔΙΚΕΣ (1).zip'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f .github/workflows/upload-assignment-files.yml
          git add "$pdf_name" "$zip_name" .github/workflows/upload-assignment-files.yml

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'Add assignment files [skip ci]'
          git push
